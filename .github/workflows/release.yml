name: Release

on:
  push:
    tags: ["*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check && npm run lint && npm run build && npm test
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
      - name: Create release with plugin assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp src/control/LICENSE LICENSE-Apache-2.0.txt
          gh release create "$GITHUB_REF_NAME" main.js manifest.json styles.css LICENSE LICENSE-Apache-2.0.txt NOTICE --title "$GITHUB_REF_NAME" --generate-notes
